server.port=8082
spring.application.name=vet-service
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/vet_db?createDatabaseIfNotExist=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jackson.serialization.write-dates-as-timestamps=false
erp.user-url=${USER_URL:http://localhost:8081}
erp.pharmacy-url=${PHARMACY_URL:http://localhost:8083}
erp.milk-url=${MILK_URL:http://localhost:8084}
erp.vet-url=${VET_URL:http://localhost:8082}

